<!doctype html>
<html lang="es" data-mode="dark" data-color="naranja">
<head>
  <meta charset="utf-8">
  <title>Zona privada · MDA</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#070d12">
  <!-- app instalable: en el iPhone, Safari > Compartir > «Añadir a pantalla de inicio» -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="MDA">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="img/icono-32.png">
  <link rel="preload" href="fonts/panchang-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/switzer-400.woff2" as="font" type="font/woff2" crossorigin>
  <!-- la foto del menú baja con el HTML, no cuando arranca Angular: así no aparece vacía con mala conexión -->
  <link rel="preload" href="img/avatar.webp?v=3" as="image" fetchpriority="high">
  <style>
    /* mientras no hay app: sin zoom ni desplazamiento, y el cargador cubre toda la pantalla */
    html { touch-action: manipulation; -webkit-text-size-adjust: 100%; background: #070d12; }
  </style>
  <script>
    // Safari del iPhone ignora user-scalable=no: se corta el gesto de pellizcar y el doble toque de zoom
    ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (n) { document.addEventListener(n, function (e) { e.preventDefault(); }, { passive: false }); });
    document.addEventListener('touchmove', function (e) { if (e.touches.length > 1 && !e.target.closest('[data-zoom]')) e.preventDefault(); }, { passive: false });
  </script>
</head>
<body>
  <!-- se ve mientras baja el código; Angular lo sustituye al arrancar -->
  <app-root><div class="nucleo" role="status" aria-label="Cargando">
    <div class="nucleo__reactor" aria-hidden="true">
      <i class="r r1"></i><i class="r r2"></i><i class="r r3"></i>
      <i class="o" style="--i:-7%;--d:3.6s"></i><i class="o" style="--i:4%;--d:5.2s;animation-direction:reverse"></i><i class="o" style="--i:-3%;--d:4.1s;--e:-1.3s"></i><i class="o" style="--i:9%;--d:6.4s;--e:-2.6s;animation-direction:reverse"></i><i class="o" style="--i:-11%;--d:7.5s;--e:-4s"></i>
      <span class="nucleo__barrido"></span>
      <b class="nucleo__marca">MDA</b>
    </div>
    <p class="nucleo__txt">Iniciando<i>.</i><i>.</i><i>.</i></p>
  </div></app-root>
</body>
</html>
