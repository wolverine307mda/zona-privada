# Entorno de PRUEBAS en Docker, para hacer cambios sin tocar la zona privada real (la versión de escritorio).
# Es un proyecto de Docker aparte, «zona-privada-pruebas», con solo dos contenedores (zp-pruebas-db y zp-pruebas-api)
# y sus propios volúmenes: en Docker Desktop salen agrupados con ese nombre, así sabes cuáles son de pruebas.
#
#   docker compose -f compose.yaml -f compose.test.yaml up -d --build api
#
# No sale a Internet (sin túnel): se prueba en http://localhost:8080 (si la real está parada) o con el puerto que se le asigne.
#
# Qué cambia respecto a compose.yaml:
#  - «ensayo»: no manda Telegram, correo, WhatsApp ni notificaciones, ni toca tus aparatos (no hay dos bots ni órdenes duplicadas).
#  - tus carpetas compartidas van en SOLO LECTURA: una prueba que falle no puede borrar ni cambiar tus archivos.
#  - cookie de sesión con otro nombre (las cookies no distinguen puertos: si no, entrar aquí cerraría tu sesión de la real).
#  - una barra «Entorno de pruebas» en todas las pantallas.
#  - sin salida a Internet y sin agente del PC (habla con la real).
# Su base de datos es la del Docker de siempre: una copia de cuando se importó, no la real.
name: zona-privada-pruebas

services:
  db:
    container_name: zp-pruebas-db

  api:
    container_name: zp-pruebas-api
    hostname: equipo-de-casa-pruebas
    environment:
      Escritorio__Ensayo: "true"
      App__CookieNombre: mda.sesion.pruebas
      App__Entorno: pruebas
      # nada de servicios externos desde aquí
      Telegram__Token: ""
      WhatsApp__Telefono: ""
      WhatsApp__ApiKey: ""
      Correo__Servidor: ""
      Correo__Usuario: ""
      Correo__Clave: ""
      Correo__Para: ""
      Spotify__ClientId: ""
      Spotify__ClientSecret: ""
      Google__ClientId: ""
      Google__ClientSecret: ""
      Healthcheck__Url: ""
      Agente__Token: ""
      Seq__Url: ""
    volumes:
      - ${CARPETA_DOCUMENTOS:-./carpetas/documentos}:/carpetas/documentos:ro
      - ${CARPETA_ESCRITORIO:-./carpetas/escritorio}:/carpetas/escritorio:ro
      - ${CARPETA_DESCARGAS:-./carpetas/descargas}:/carpetas/descargas:ro
      - ${CARPETA_IMAGENES:-./carpetas/imagenes}:/carpetas/imagenes:ro
      - ${CARPETA_MUSICA:-./carpetas/musica}:/carpetas/musica:ro
      - ${CARPETA_VIDEOS:-./carpetas/videos}:/carpetas/videos:ro
