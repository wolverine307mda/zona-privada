# Zona privada en el equipo de casa: base de datos, API (con el front dentro), registros y Tailscale Funnel (o Cloudflare Tunnel).
#   docker compose up -d --build                    -> todo menos la salida a Internet (prueba en http://localhost:8080)
#   docker compose --profile publico up -d --build  -> también Tailscale Funnel: la app sale por Internet con HTTPS
#   docker compose --profile tunel up -d --build    -> alternativa con Cloudflare Tunnel
name: zona-privada

# registros de Docker con tope: sin esto el json-file crece sin límite
x-registros: &registros
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: zonaprivada
      POSTGRES_USER: mda
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
    logging: *registros
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mda -d zonaprivada"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    # nombre que sale en el panel (si no, el id del contenedor)
    hostname: equipo-de-casa
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # endurecimiento: sin escribir en el sistema de archivos del contenedor (solo /tmp, /claves y las carpetas montadas),
    # sin capacidades de Linux ni escalada de privilegios, y con tope de memoria y procesos
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    pids_limit: 512
    logging: *registros
    environment:
      # solo se aceptan estos nombres de host (la cabecera Host); separados por «;»
      AllowedHosts: ${ALLOWED_HOSTS:-*.ts.net;localhost;127.0.0.1;api;equipo-de-casa}
      # true = se pueden subir .exe, .bat, .ps1… a Documentos (por defecto, no)
      Archivos__PermitirEjecutables: ${PERMITIR_EJECUTABLES:-false}
      ConnectionStrings__Postgres: Host=db;Port=5432;Database=zonaprivada;Username=mda;Password=${POSTGRES_PASSWORD};Gss Encryption Mode=Disable
      Admin__Usuario: ${ADMIN_USUARIO:-}
      Admin__Email: ${ADMIN_EMAIL:?Falta ADMIN_EMAIL en .env}
      Admin__Password: ${ADMIN_PASSWORD:?Falta ADMIN_PASSWORD en .env}
      Seq__Url: http://seq:5341
      DataProtection__Ruta: /claves
      # miniaturas WebP de la galería pública (se pueden borrar: se regeneran)
      Galeria__Derivados: /derivados
      # clave que cifra notas, portapapeles y claves de servicios en la base. Si se pierde, esos datos no se pueden leer: guárdala fuera del PC
      Boveda__Clave: "${MDA_CLAVE_MAESTRA:?Falta MDA_CLAVE_MAESTRA en .env, genérala con openssl rand -base64 32}"
      # PIN inicial de Documentos (cuatro cifras): solo se usa si aún no hay ninguno; luego se cambia desde Seguridad y esta línea sobra
      Documentos__PinInicial: ${DOCUMENTOS_PIN_INICIAL:-}
      Agente__Token: ${AGENTE_TOKEN:-}
      Healthcheck__Url: ${HEALTHCHECK_URL:-}
      Archivos__Base: /carpetas
      App__UrlPublica: ${URL_PUBLICA:-}
      App__Zona: ${ZONA_HORARIA:-Europe/Madrid}
      # avisos de la agenda (opcionales): correo por SMTP y WhatsApp con CallMeBot
      Correo__Servidor: ${CORREO_SERVIDOR:-}
      Correo__Puerto: ${CORREO_PUERTO:-587}
      Correo__Usuario: ${CORREO_USUARIO:-}
      Correo__Clave: ${CORREO_CLAVE:-}
      Correo__Para: ${CORREO_PARA:-}
      WhatsApp__Telefono: ${WHATSAPP_TELEFONO:-}
      WhatsApp__ApiKey: ${WHATSAPP_APIKEY:-}
      # bot de Telegram (opcional): el token que da @BotFather
      Telegram__Token: ${TELEGRAM_TOKEN:-}
      # cuentas enlazadas (opcionales): Spotify y Google Calendar
      Spotify__ClientId: ${SPOTIFY_CLIENT_ID:-}
      Spotify__ClientSecret: ${SPOTIFY_CLIENT_SECRET:-}
      Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
      # la API vigila que la copia diaria exista (y avisa si falta)
      Copias__Ruta: /copias
    volumes:
      - claves:/claves
      - derivados:/derivados
      - ./copias:/copias:ro
      # «Documentos»: las carpetas del equipo (rutas de Windows en .env; sin ellas, carpetas vacías en ./carpetas)
      # MODO_<carpeta>=ro la deja de solo lectura (no se puede subir, renombrar ni borrar desde la app); por defecto rw
      - ${CARPETA_DOCUMENTOS:-./carpetas/documentos}:/carpetas/documentos:${MODO_DOCUMENTOS:-rw}
      - ${CARPETA_ESCRITORIO:-./carpetas/escritorio}:/carpetas/escritorio:${MODO_ESCRITORIO:-rw}
      - ${CARPETA_DESCARGAS:-./carpetas/descargas}:/carpetas/descargas:${MODO_DESCARGAS:-rw}
      - ${CARPETA_IMAGENES:-./carpetas/imagenes}:/carpetas/imagenes:${MODO_IMAGENES:-rw}
      - ${CARPETA_MUSICA:-./carpetas/musica}:/carpetas/musica:${MODO_MUSICA:-rw}
      - ${CARPETA_VIDEOS:-./carpetas/videos}:/carpetas/videos:${MODO_VIDEOS:-rw}
    # solo en este equipo: desde fuera se entra por el túnel, nunca por un puerto abierto
    ports:
      - "127.0.0.1:8080:8080"

  seq:
    image: datalust/seq:2026.1
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_ADMINPASSWORD: ${SEQ_PASSWORD:?Falta SEQ_PASSWORD en .env}
    logging: *registros
    volumes:
      - seq:/data
    ports:
      - "127.0.0.1:5341:80"

  tunel:
    image: cloudflare/cloudflared:2026.10.6
    restart: unless-stopped
    profiles: ["tunel"]
    command: tunnel --no-autoupdate run
    environment:
      # solo hace falta con el perfil «tunel»; sin él, el resto arranca igual
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - api

  # Tailscale Funnel: da al equipo una dirección HTTPS pública y fija (https://equipo-de-casa.<tu-red>.ts.net)
  # sin abrir puertos del router. Usa TS_AUTHKEY del .env solo la primera vez; luego guarda su estado.
  #   docker compose --profile publico up -d
  tailscale:
    image: tailscale/tailscale:v1.104.4
    hostname: equipo-de-casa
    restart: unless-stopped
    profiles: ["publico"]
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "true"
    volumes:
      - tailscale:/var/lib/tailscale
      - ./tailscale:/config:ro
    depends_on:
      - api

  # copias de seguridad (ver herramientas/copias.sh): una diaria de la base de datos en ./copias (las 14 últimas), la misma cifrada con age
  # junto con el volumen de claves en la carpeta de la nube (OneDrive) si hay COPIAS_AGE_PUBLICA, y cada semana un simulacro:
  # la última copia se restaura en una base vacía y la API te avisa por Telegram si no sirve.
  copias:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      TZ: Europe/Madrid
      COPIAS_AGE_PUBLICA: ${COPIAS_AGE_PUBLICA:-}
    volumes:
      - ./copias:/copias
      - ./herramientas/copias.sh:/copias.sh:ro
      - claves:/claves:ro
      - ${COPIAS_NUBE:-./copias/nube}:/nube
    entrypoint: ["sh", "/copias.sh"]

volumes:
  db:
  seq:
  claves:
  derivados:
  tailscale:
