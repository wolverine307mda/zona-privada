# Zona privada en el equipo de casa: base de datos, API (con el front dentro), registros y túnel de Cloudflare.
#   docker compose up -d --build                 -> todo menos el túnel (prueba en http://localhost:8080)
#   docker compose --profile tunel up -d --build -> también el túnel: la app sale por Internet con HTTPS
name: zona-privada

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: zonaprivada
      POSTGRES_USER: mda
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mda -d zonaprivada"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    # nombre que sale en el panel (si no, el id del contenedor)
    hostname: equipo-de-casa
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Postgres: Host=db;Port=5432;Database=zonaprivada;Username=mda;Password=${POSTGRES_PASSWORD};Gss Encryption Mode=Disable
      Admin__Usuario: ${ADMIN_USUARIO:-}
      Admin__Email: ${ADMIN_EMAIL:?Falta ADMIN_EMAIL en .env}
      Admin__Password: ${ADMIN_PASSWORD:?Falta ADMIN_PASSWORD en .env}
      Seq__Url: http://seq:5341
      DataProtection__Ruta: /claves
      Agente__Token: ${AGENTE_TOKEN:-}
      Archivos__Base: /carpetas
      App__UrlPublica: ${URL_PUBLICA:-}
      App__Zona: ${ZONA_HORARIA:-Europe/Madrid}
      # avisos de la agenda (opcionales): correo por SMTP y WhatsApp con CallMeBot
      Correo__Servidor: ${CORREO_SERVIDOR:-}
      Correo__Puerto: ${CORREO_PUERTO:-587}
      Correo__Usuario: ${CORREO_USUARIO:-}
      Correo__Clave: ${CORREO_CLAVE:-}
      Correo__Para: ${CORREO_PARA:-}
      WhatsApp__Telefono: ${WHATSAPP_TELEFONO:-}
      WhatsApp__ApiKey: ${WHATSAPP_APIKEY:-}
      # cuentas enlazadas (opcionales): Spotify y Google Calendar
      Spotify__ClientId: ${SPOTIFY_CLIENT_ID:-}
      Spotify__ClientSecret: ${SPOTIFY_CLIENT_SECRET:-}
      Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
    volumes:
      - claves:/claves
      # «Documentos»: las carpetas del equipo (rutas de Windows en .env; sin ellas, carpetas vacías en ./carpetas)
      - ${CARPETA_DOCUMENTOS:-./carpetas/documentos}:/carpetas/documentos
      - ${CARPETA_ESCRITORIO:-./carpetas/escritorio}:/carpetas/escritorio
      - ${CARPETA_DESCARGAS:-./carpetas/descargas}:/carpetas/descargas
      - ${CARPETA_IMAGENES:-./carpetas/imagenes}:/carpetas/imagenes
      - ${CARPETA_MUSICA:-./carpetas/musica}:/carpetas/musica
      - ${CARPETA_VIDEOS:-./carpetas/videos}:/carpetas/videos
    # solo en este equipo: desde fuera se entra por el túnel, nunca por un puerto abierto
    ports:
      - "127.0.0.1:8080:8080"

  seq:
    image: datalust/seq:2026.1
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_ADMINPASSWORD: ${SEQ_PASSWORD:?Falta SEQ_PASSWORD en .env}
    volumes:
      - seq:/data
    ports:
      - "127.0.0.1:5341:80"

  tunel:
    image: cloudflare/cloudflared:2026.10.6
    restart: unless-stopped
    profiles: ["tunel"]
    command: tunnel --no-autoupdate run
    environment:
      # solo hace falta con el perfil «tunel»; sin él, el resto arranca igual
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - api

  # Tailscale Funnel: da al equipo una dirección HTTPS pública y fija (https://equipo-de-casa.<tu-red>.ts.net)
  # sin abrir puertos del router. Usa TS_AUTHKEY del .env solo la primera vez; luego guarda su estado.
  #   docker compose --profile publico up -d
  tailscale:
    image: tailscale/tailscale:v1.104.4
    hostname: equipo-de-casa
    restart: unless-stopped
    profiles: ["publico"]
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "true"
    volumes:
      - tailscale:/var/lib/tailscale
      - ./tailscale:/config:ro
    depends_on:
      - api

  # copia de seguridad diaria de la base de datos en ./copias (se guardan las 14 últimas)
  copias:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./copias:/copias
    entrypoint: >
      sh -c 'while true; do
        pg_dump -h db -U mda -d zonaprivada -Fc -f /copias/zonaprivada-$$(date +%Y%m%d-%H%M).dump &&
        ls -1t /copias/*.dump | tail -n +15 | xargs -r rm -f;
        sleep 86400; done'

volumes:
  db:
  seq:
  claves:
  tailscale:
